<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- NERFA 2026 tap card: 4x6in portrait insert for an acrylic sign holder.
     An NTAG215 sticker (25–30mm) goes on the BACK of the card, centred
     behind the red tap circle. The tag holds bonetflynn.com/tag and the
     QR bonetflynn.com/room, so taps and scans are counted separately.
     Print source: render with headless Chrome (see print/README or the
     commit message). ?size=5x7 makes the larger card (same layout, scaled
     up 7/6, with a little more side margin); ?size=letter makes an
     8.5x11 sign (scaled 11/6). ?sheet=1 is the home-printer version: two
     4x6 or one 5x7 on Letter with crop marks, or for letter, the page
     itself with no bleed (the printer's white edge is the only change). -->
<title>NERFA tap card</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500;1,9..144,600&display=block" rel="stylesheet" />
<style>
  :root{
    --paper:#FAF6EE; --paper-2:#F1EADC; --sand:#E7DCC9;
    --ink:#17130F; --ink-soft:#3B322A; --muted:#6F6157;
    --red:#E23A2E; --red-deep:#B12318;
    --bleed:0.125in;
    /* Trim size and content scale; ?size=5x7 overrides these. */
    --tw:4in; --th:6in; --z:1;
  }
  /* @page is injected by the script below, to match the chosen size. */
  html,body{margin:0;padding:0;}
  body{
    font-family:"Archivo",system-ui,sans-serif;color:var(--ink);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    -webkit-font-smoothing:antialiased;
  }

  /* One card = trim size plus 1/8in bleed on every side. */
  .card{
    width:calc(var(--tw) + 2 * var(--bleed));height:calc(var(--th) + 2 * var(--bleed));
    position:relative;overflow:hidden;
    /* White, not the site's cream: a pale tint prints unevenly (speckled on
       inkjets, blotchy on lasers). Solid red and black print cleanly. */
    background:#fff;
  }
  /* Everything important stays 0.3in inside the trim line. */
  .safe{
    position:absolute;
    inset:calc(var(--bleed) + 0.28in);
    /* Scales the whole layout for larger cards (the inset scales with it,
       so margins and the bottom gap stay proportional). */
    zoom:var(--z);
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  /* Red band across the top, bleeding off three edges. */
  .band{
    position:absolute;left:0;right:0;top:0;height:calc(var(--bleed) + 0.16in * var(--z));
    background:var(--red);
  }

  .head{display:flex;align-items:center;gap:0.16in;width:100%;justify-content:center;margin-top:0.06in;}
  .mark{
    width:0.78in;height:0.78in;border-radius:50%;flex:none;
    background:#fff;box-shadow:inset 0 0 0 1.6pt var(--ink);
    display:grid;place-items:center;
  }
  .mark img{height:0.5in;width:auto;margin-top:1pt;}
  .names{text-align:left;}
  /* Header type: Anton for the names, Fraunces italic around them (this
     line, the ampersand, the motto); only the booking line is Archivo. */
  .eyebrow{
    font-family:"Fraunces",serif;font-style:italic;font-weight:500;
    color:var(--red-deep);font-size:11pt;line-height:1.1;margin:0 0 3pt;
  }
  .names h1{
    margin:0;font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;
    font-size:21pt;line-height:0.98;letter-spacing:.01em;
  }
  /* Smaller than the caps and lifted so its middle lines up with the middle
     of CHRIS FLYNN, instead of hanging off the baseline. */
  .amp{font-family:"Fraunces",serif;font-style:italic;font-weight:500;color:var(--red);text-transform:none;
    font-size:16pt;line-height:1;display:inline-block;vertical-align:0.26em;margin-right:3pt;
    /* Fraunces swaps to a plain ampersand at small optical sizes; pin the
       ornate one, same as index.html's .amp-small. */
    font-optical-sizing:none;font-variation-settings:"opsz" 30;}

  /* Same motto and treatment as the email footer. */
  .tag .motto{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:11pt;color:var(--ink);line-height:1.3;}
  .tag{font-size:8.6pt;line-height:1.35;color:var(--ink-soft);margin:0.12in 0 0;max-width:3.2in;}

  /* Tap target. The sticker sits behind this circle. */
  .tap{margin-top:0.2in;display:flex;flex-direction:column;align-items:center;}
  /* Solid red target with a thin red outer ring, white gap between. */
  .ring{
    width:1.55in;height:1.55in;border-radius:50%;
    display:grid;place-items:center;
    background:var(--red);
    box-shadow:0 0 0 4pt #fff, 0 0 0 5.4pt var(--red);
  }
  .ring svg{width:0.72in;height:0.72in;}
  .tap-label{
    font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.03em;
    font-size:19pt;line-height:1;margin:0.12in 0 0;
  }
  .note{
    position:relative;margin:6pt 0 0;
    font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:11pt;line-height:1.15;
    color:var(--red-deep);
  }
  .note b{font-weight:600;color:var(--ink);}
  /* Arrow starts just left of the note and ends on the circle's lower-left. */
  .note svg{position:absolute;left:-6pt;top:-44pt;width:72pt;height:52pt;overflow:visible;}

  .or{
    display:flex;align-items:center;gap:8pt;width:2.4in;margin:0.14in 0 0.1in;
    font-family:"Fraunces",serif;font-style:italic;font-size:10pt;color:var(--muted);
  }
  .or::before,.or::after{content:"";flex:1;height:0.6pt;background:var(--sand);}

  .scan{display:flex;align-items:center;gap:0.16in;}
  .qr{width:0.95in;height:0.95in;padding:0.06in;background:#fff;}
  .qr img{width:100%;height:100%;display:block;}
  .gets{text-align:left;margin:0;padding:0;list-style:none;font-size:8.4pt;line-height:1.55;font-weight:600;}
  .gets .aside{font-weight:400;font-style:italic;font-family:"Fraunces",serif;color:var(--muted);}
  .gets li::before{content:"→ ";color:var(--red);}

  .foot{
    margin-top:auto;font-size:8pt;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
  }

  /* ---- Letter sheet: two cards side by side, with crop marks ---- */
  body.sheet .card{position:absolute;}
  @media print{ body.sheet{ } }
  .sheet-page{position:relative;}
  .crop{position:absolute;background:#000;}
</style>
</head>
<body>
<template id="cardTpl">
  <div class="card">
    <div class="band"></div>
    <div class="safe">
      <div class="head">
        <div class="mark"><img src="../images/mark.webp" alt="" /></div>
        <div class="names">
          <p class="eyebrow">Thanks for stopping by the room!</p>
          <h1>Deni Bonet</h1>
          <h1><span class="amp">&amp;</span>Chris Flynn</h1>
        </div>
      </div>
      <p class="tag"><span class="motto">Chief Executives of String-Driven Chaos</span><br>Now booking 2027 concerts and house concerts.</p>

      <div class="tap">
        <div class="ring">
          <!-- Contactless / NFC symbol -->
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" aria-hidden="true">
            <path d="M14 17.5c2.6 4.1 2.6 8.9 0 13"/>
            <path d="M21 13c4.4 6.8 4.4 15.2 0 22"/>
            <path d="M28 8.5c6.2 9.6 6.2 21.4 0 31"/>
            <path d="M35 4.5c8 12.2 8 26.8 0 39"/>
          </svg>
        </div>
        <p class="tap-label">Go ahead, tap us</p>
        <!-- iPhones only read tags near the top edge: a hand-drawn note with
             an arrow curling up to the tap circle. -->
        <p class="note"><svg viewBox="0 0 72 52" fill="none" aria-hidden="true">
            <path d="M2 50C0 30 20 10 66 5" stroke="#E23A2E" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M61 8.4L66 5L60.4 2.8" stroke="#E23A2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>psst, iPhone folks: <b>lead with the top edge</b></p>
      </div>

      <div class="or">no NFC? no problem</div>

      <div class="scan">
        <div class="qr"><img src="nerfa-tap-card-qr.svg" alt="QR code for bonetflynn.com/room" /></div>
        <ul class="gets">
          <li>Save us <span class="aside">(no business card to lose)</span></li>
          <li>Join the list <span class="aside">(show dates, no spam)</span></li>
          <li>Watch us <span class="aside">(no ticket needed)</span></li>
          <li>Book us <span class="aside">(we'd love to play your room)</span></li>
        </ul>
      </div>

      <p class="foot">bonetflynn.com/nerfa</p>
    </div>
  </div>
</template>
<script>
  const q = new URLSearchParams(location.search);
  const sheet = q.has('sheet');
  const size = q.get('size') || '4x6';
  const big = size === '5x7';
  const letter = size === 'letter';
  const tpl = document.getElementById('cardTpl');
  // Letter on a home printer has no bleed: the page is the card.
  const B = letter && sheet ? 0 : 0.125; // bleed, in
  const [TW, TH] = { '4x6': [4, 6], '5x7': [5, 7], 'letter': [8.5, 11] }[size];
  const W = TW + 2 * B, H = TH + 2 * B;  // card incl. bleed
  const root = document.documentElement.style;
  root.setProperty('--tw', TW + 'in');
  root.setProperty('--th', TH + 'in');
  root.setProperty('--bleed', B + 'in');
  root.setProperty('--z', String(TH / 6)); // layout is drawn for 6in tall

  const setPage = (w, h) => {
    const st = document.createElement('style');
    st.textContent = `@page{size:${w}in ${h}in;margin:0}`;
    document.head.appendChild(st);
  };

  if (!sheet || letter) {
    setPage(W, H);
    document.body.appendChild(tpl.content.cloneNode(true));
  } else {
    // 4x6: two cards side by side on landscape Letter, 0.5in gutter.
    // 5x7: one card centred on portrait Letter. Each keeps its own bleed.
    const PW = big ? 8.5 : 11, PH = big ? 11 : 8.5, n = big ? 1 : 2, gap = 0.5;
    setPage(PW, PH);
    document.body.classList.add('sheet');
    const page = document.createElement('div');
    page.className = 'sheet-page';
    page.style.width = PW + 'in'; page.style.height = PH + 'in';
    const x0 = (PW - (n * W + (n - 1) * gap)) / 2, y0 = (PH - H) / 2;
    const marks = [];
    for (let i = 0; i < n; i++) {
      const c = tpl.content.firstElementChild.cloneNode(true);
      const x = x0 + i * (W + gap);
      c.style.left = x + 'in'; c.style.top = y0 + 'in';
      page.appendChild(c);
      // Crop marks sit just outside the bleed at each trim corner.
      const L = x + B, R = x + W - B, T = y0 + B, Bo = y0 + H - B;
      const len = 0.22, off = 0.16, t = 0.008;
      for (const xx of [L, R]) for (const yy of [T, Bo])
        marks.push([xx - t / 2, yy === T ? yy - off - len : yy + off, t, len]);
      for (const yy of [T, Bo]) for (const xx of [L, R])
        marks.push([xx === L ? xx - off - len : xx + off, yy - t / 2, len, t]);
    }
    marks.forEach(([x, y, w, h]) => {
      const m = document.createElement('div');
      m.className = 'crop';
      Object.assign(m.style, { left: x + 'in', top: y + 'in', width: w + 'in', height: h + 'in' });
      page.appendChild(m);
    });
    document.body.appendChild(page);
  }
</script>
</body>
</html>
