name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only these files/folders are copied into the deployed site. Everything
      # else in the repo (checkpoints, old/, campaign-template.html, etc.)
      # stays in the repo but never reaches the live site or any URL on it.
      # CNAME carries the custom domain (bonetflynn.com) — without it in the
      # published artifact, GitHub can drop the custom domain mapping on a
      # future deploy.
      - name: Build minimal site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp confirmed.html _site/
          cp robots.txt _site/
          cp -r images _site/
          cp -r videos _site/
          echo "bonetflynn.com" > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
